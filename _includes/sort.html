<div class="sort-container">

  <div class="page-views">
      Page Views <a href="/web-analytics-en">~{{ site.monthly_page_views }}</a><br>
  </div>

  <div class="deepwiki-link">
    <a class="deepwiki-badge" href="https://deepwiki.com/lzwjava/jekyll-ai-blog" target="_blank" rel="noopener">
      Ask DeepWiki
    </a>
    <form class="deepwiki-form" action="https://deepwiki.com/lzwjava/jekyll-ai-blog" method="get" target="_blank" rel="noopener">
      <input type="text" name="q" class="deepwiki-input"
             placeholder="Ask DeepWiki anything about this blog..."
             aria-label="Ask DeepWiki" />
      <button type="submit" class="deepwiki-submit" aria-label="Ask">Ask</button>
    </form>
  </div>

  {% assign type = include.type | default: "notes" %}
  <div class="nav-links">
    <a href="/index-en.html">Posts</a>
    <a href="/index-zh.html">文章</a>
    <a href="/notes-en.html">Notes</a>
    <a href="/notes-zh.html">笔记</a>
  </div>


  <div>

    <div id="post-number" class="post-number" data-type="{{ type }}">
      {{ site[type].size }} {{ type }}
      ({{ site[type].size | divided_by: 7 | times: 6 }} Translated by <a href="https://openrouter.ai">AI</a>)
    </div>

  </div>
</div>
